[package]
name = "gitstudiopro"
version = "0.1.0"
description = "A considered workspace for Git"
authors = ["GitStudio Pro contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/realsaraf/gitstudiopro"

[lib]
name = "gitstudiopro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
