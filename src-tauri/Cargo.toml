[package]
name = "gitstudiopro"
version = "0.1.0"
description = "A considered workspace for Git"
authors = ["GitStudio Pro contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/realsaraf/gitstudiopro"

[lib]
name = "gitstudiopro_lib"
# The Windows/macOS executable links this Rust library directly. Mobile/FFI
# artifacts would require staticlib/cdylib; generating them here wastes disk.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
