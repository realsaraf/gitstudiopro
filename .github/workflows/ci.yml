name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Exercise Windows native UI against disposable repositories
        if: runner.os == 'Windows'
        env:
          GITSTUDIO_BINARY: src-tauri/target/release/gitstudiopro.exe
        run: |
          npm run test:native:workflows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native:tools
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: native-ui-evidence-Windows
          path: |
            artifacts/native-workflows/
            artifacts/native-tools/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: gitstudiopro-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
