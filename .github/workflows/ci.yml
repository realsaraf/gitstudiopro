name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Ensure WebView2 runtime for native UI tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeRoots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = Get-ChildItem -Path $runtimeRoots -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'WebView2 bootstrapper signature validation failed'
            }
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "WebView2 installation failed: $($installer.ExitCode)" }
            $runtime = Get-ChildItem -Path $runtimeRoots -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $runtime) { throw 'WebView2 runtime executable was not found' }
          Write-Host "WebView2 $($runtime.VersionInfo.FileVersion): $($runtime.FullName)"
      - name: Prepare normal-integrity native UI process
        if: runner.os == 'Windows'
        shell: pwsh
        # WebView2 150+ ignores debugging environment variables in elevated hosts.
        # Run tests as a normal user, as Tauri's own Windows e2e workflow does.
        # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
        run: |
          choco install gsudo --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runnerUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls "$env:GITHUB_WORKSPACE" /grant "${runnerUser}:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows native UI against disposable repositories
        if: runner.os == 'Windows'
        env:
          GITSTUDIO_BINARY: src-tauri/target/release/gitstudiopro.exe
        run: |
          & "C:\tools\gsudo\Current\gsudo.exe" --integrity Medium node scripts/native-workflows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\tools\gsudo\Current\gsudo.exe" --integrity Medium node scripts/native-tools.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: native-ui-evidence-Windows
          path: |
            artifacts/native-workflows/
            artifacts/native-tools/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: gitstudiopro-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
